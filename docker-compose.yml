version: "3.9"

# Orquesta los 5 microservicios Python + las 3 bases de datos de la Capa de
# Persistencia (ver .antigravity/project_map.md). Cada servicio de app/ tiene
# su propio pyproject.toml/.env.example; este compose asume que existira un
# Dockerfile por servicio (pendiente de crear cuando cada servicio tenga
# codigo real que ejecutar - por ahora sirve como referencia de topologia).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tdah_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  auth_service:
    build: ./auth_service
    env_file: ./auth_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  tools_service:
    build: ./tools_service
    env_file: ./tools_service/.env
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - mongo

  agent_service:
    build: ./agent_service
    env_file: ./agent_service/.env
    ports:
      - "8003:8003"
    depends_on:
      - qdrant
      - tools_service

  proactive_service:
    build: ./proactive_service
    env_file: ./proactive_service/.env
    ports:
      - "8004:8004"
    depends_on:
      - mongo
      - tools_service
      - agent_service

  gateway:
    build: ./gateway
    env_file: ./gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - tools_service
      - agent_service
      - proactive_service

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
