[project]
name = "agent-service"
version = "0.1.0"
description = "Microservicio del Agente (LangGraph + LLM) - orquestacion conversacional, RAG sobre BD Vectorial (Qdrant), invoca tools_service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "qdrant-client>=1.12",
    "motor>=3.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
