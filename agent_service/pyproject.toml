[project]
name = "agent-service"
version = "0.1.0"
description = "Microservicio del Agente (LangGraph + LLM) - orquestacion conversacional, RAG sobre BD Vectorial (Qdrant), invoca tools_service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "qdrant-client>=1.12",
    "motor>=3.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# langchain-ollama y mongomock-motor solo se usan en tests/ (modelo local y
# Mongo en memoria); el Dockerfile instala su propia lista, sin estos extras.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "langchain-ollama>=1.0",
    "mongomock-motor>=0.0.36",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Las de integracion usan Ollama local y tardan: se corren con `pytest -m ollama`.
addopts = "-m \"not ollama\""
markers = [
    "ollama: requiere Ollama local (qwen3.8 y qwen3-embedding:0.6b)",
]
# El QdrantClient de app/memory/vector_store.py se crea al importar y no hay
# servidor en las pruebas (usan Qdrant en memoria).
filterwarnings = ["ignore:Failed to obtain server version:UserWarning"]
