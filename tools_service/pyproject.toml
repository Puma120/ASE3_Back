[project]
name = "tools-service"
version = "0.1.0"
description = "Microservicio de herramientas (Tools) - logica de negocio e integraciones con APIs de Google. Conecta a BD SQL (PostgreSQL) y BD NoSQL (MongoDB)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "motor>=3.6",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
