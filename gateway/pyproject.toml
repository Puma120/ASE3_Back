[project]
name = "gateway"
version = "0.1.0"
description = "API Gateway / Orquestador - punto unico de entrada, valida sesion y enruta a los microservicios."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt>=2.9",
]
