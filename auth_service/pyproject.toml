[project]
name = "auth-service"
version = "0.1.0"
description = "Microservicio de Autenticacion y configuracion - login, JWT/OAuth, perfil, credenciales. Conecta a BD SQL (PostgreSQL)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 rompe con bcrypt>=4.1 (bug conocido en su autodeteccion de
    # backend, ValueError "password cannot be longer than 72 bytes" con
    # cualquier password, incluso cortas) - fijado a la ultima version compatible.
    "bcrypt<4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
